[package]
name = "usfm_onion_wasm"
version.workspace = true
edition.workspace = true
description = "WASM bindings for usfm_onion"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `braid`/`usfm_onion_wire` stay direct dependencies for what has not moved to
# `usfm_onion_host` (per-book restoreCorpus/verifyPackedBook, and every other
# resident verb) -- this crate is still the composition root for those.
# Publish/restorePublishedCorpus's composition itself now lives in
# `usfm_onion_host`; this crate is a thin `#[wasm_bindgen]` projection over it
# (borrowed/owned/serde glue only), never a second copy of that logic.
braid = { path = "../braid" }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tsify = "0.5.6"
usfm_onion = { path = "../.." }
usfm_onion_host = { path = "../usfm_onion_host", features = ["wasm"] }
usfm_onion_wire = { path = "../usfm_onion_wire", features = ["wasm"] }
wasm-bindgen = "0.2"

# Vestigial: `[profile.release]` at the workspace root is native-tuned now
# (plain Cargo defaults), not the wasm size squeeze this metadata implies —
# `wasm-pack build --release` (the built-in flag) would run wasm-opt with
# these flags on top of *native*-profile rustc codegen, which is worse than
# either of the purpose-built `wasm-release`/`wasm-release-fast` profiles.
# Don't build wasm this way — use `npm run build:wasm:bundler`/`build:wasm:web`,
# which drive `wasm-pack build --profile wasm-release-fast --no-opt` and
# then invoke `wasm-opt` explicitly (see root `Cargo.toml` and `package.json`).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
