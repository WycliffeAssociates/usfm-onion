[package]
name = "usfm_onion_wasm"
version.workspace = true
edition.workspace = true
description = "WASM bindings for usfm_onion"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `braid` is the whole resident surface, packed publish/restore included: this
# crate names its types constantly to convert to and from them, and the `Braid`
# class here is a thin `#[wasm_bindgen]` projection over `braid::Braid` (DTO
# glue only), never a second copy of any composition. Its `wasm` feature is
# what makes the publication/restore types tsify-projectable, so they cross
# this boundary as themselves rather than as a hand-mirror.
braid = { path = "../braid", features = ["wasm"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde-wasm-bindgen = "0.6"
# `js`, not the default `json`: `json` is tsify's legacy `JsValue::from_serde`
# (`gloo-utils`) path, which has no `#[serde(with = "serde_bytes")]` support
# at all (bytes cross as a plain `number[]` regardless of that attribute) and
# ignores every `SerializationConfig` knob (`hashmap_as_object` included).
# `js` (`serde-wasm-bindgen`) is what actually honors both -- required for
# the v0.1.5 bytes-at-boundary convention's `Uint8Array` fields to be real.
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
usfm_onion = { path = "../.." }
usfm_onion_wire = { path = "../usfm_onion_wire", features = ["wasm"] }
wasm-bindgen = "0.2"

# Vestigial: `[profile.release]` at the workspace root is native-tuned now
# (plain Cargo defaults), not the wasm size squeeze this metadata implies —
# `wasm-pack build --release` (the built-in flag) would run wasm-opt with
# these flags on top of *native*-profile rustc codegen, which is worse than
# either of the purpose-built `wasm-release`/`wasm-release-fast` profiles.
# Don't build wasm this way — use `npm run build:wasm:bundler`/`build:wasm:web`,
# which drive `wasm-pack build --profile wasm-release-fast --no-opt` and
# then invoke `wasm-opt` explicitly (see root `Cargo.toml` and `package.json`).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
