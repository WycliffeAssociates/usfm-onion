[package]
name = "usfm_onion_wire"
description = "Target-agnostic serde DTOs for the usfm_onion marker wire contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
wasm = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5.6", optional = true }
usfm_onion = { path = "../.." }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1"
