[package]
name = "usfm_onion"
autobins = true
autobenches = false
version.workspace = true
edition.workspace = true
description = "Rust-first USFM parsing, linting, formatting, conversion, and diffing"
license.workspace = true
readme = "README.md"
keywords = ["usfm", "parser", "formatter", "bible", "text"]
categories = ["parser-implementations", "text-processing"]

[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "playground"
path = "src/bin/playground.rs"
bench = false

[features]
default = []

[dependencies]
logos = "0.16.1"
quick-xml = "0.37"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# `cargo bench` would otherwise inherit `[profile.release]`, which is tuned
# for wasm-pack output (size, single codegen unit). That hurts native bench
# numbers — especially HTML rendering and other branch-heavy paths. Override
# for speed instead.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"

[[bench]]
name = "operations"
harness = false

[[bench]]
name = "parallelism"
harness = false

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
lto = false
opt-level = 3
