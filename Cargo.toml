[package]
name = "usfm_onion"
autobins = true
autobenches = false
version.workspace = true
edition.workspace = true
description = "Rust-first USFM parsing, linting, formatting, conversion, and diffing"
license.workspace = true
readme = "README.md"
keywords = ["usfm", "parser", "formatter", "bible", "text"]
categories = ["parser-implementations", "text-processing"]

[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "playground"
path = "src/bin/playground.rs"
bench = false

[features]
default = []

[dependencies]
logos = "0.16.1"
quick-xml = "0.37"
regex = "1.11"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "2", features = ["unicode"] }

# Native builds compile the parallel executor (`crate::par`); wasm builds
# compile the serial fallback and never link rayon. Also covers native
# tests/benches/examples.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"
memchr = "2"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "operations"
harness = false

[[bench]]
name = "parallelism"
harness = false

# `release` is now plain Cargo defaults (opt-level 3, no lto) — this profile
# just adds debug info on top for symbolicated `samply` runs. A little slower
# to build than release itself (debug info generation), but codegen matches
# release; its own reported timings are for finding hot spots, not for
# quoting as real numbers — use `release` (or the bench harness) for those.
[profile.profiling]
inherits = "release"
debug = 2

# Reference point only, not wired into any build script: the old
# size-squeezed wasm build (reproduces the pre-2026-07 shipped binary
# byte-for-byte). `lto`/`panic` can't be package-scoped under a shared
# `release` profile (Cargo rejects both there), which is why wasm gets its
# own profile name instead of a per-package override of `release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# The shipping wasm profile (`build:wasm:bundler`/`build:wasm:web`):
# ~45% bigger than `wasm-release` for ~1.3-2x faster parse/diff/format/html
# ops — worth it for an editor-scale web app where Tauri desktop builds
# native Rust anyway and never touches this profile. `wasm-pack build
# --profile <name>` doesn't read `[package.metadata.wasm-pack.profile.*]`
# (that's only wired to wasm-pack's own --release/--dev/--profiling flags),
# so the build scripts pass `--no-opt` and run `wasm-opt` explicitly —
# requires `wasm-opt` on PATH (`brew install binaryen` / `apt install
# binaryen`).
[profile.wasm-release-fast]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"





